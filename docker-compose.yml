# ============================================================
# 云盘 Docker 编排
#
# 服务器目录结构：
#   /opt/cloud-drive/
#   ├── docker-compose.yml      ← 本文件
#   ├── .env                    ← 密钥（cp .env.example .env 后填写）
#   ├── mysql/init.sql          ← 首次启动自动建表
#   ├── backend/                ← 后端源码（cloud-drive 项目内容，含 Dockerfile）
#   └── frontend/               ← 前端源码（page 项目内容，含 Dockerfile）
#
# 启动：docker compose up -d --build
# 访问：http://服务器IP （默认 80 端口）
# ============================================================
services:
  mysql:
    image: mysql:8.0
    container_name: cloud-drive-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: cloud_drive
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql            # 数据持久化
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # 首次启动自动初始化
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: cloud-drive-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  backend:
    build: ./backend
    container_name: cloud-drive-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 数据库
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cloud_drive
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # 腾讯云 COS
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ${COS_REGION}
      COS_BUCKET_NAME: ${COS_BUCKET_NAME}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: cloud-drive-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
