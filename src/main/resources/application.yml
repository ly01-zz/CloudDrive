# ============================================================
# 部署配置（环境变量注入，密钥不落盘）
# 本地开发：IDEA Run Configuration → Environment variables 配置，
# 或复制本文件为 application-local.yml 并改用 spring.profiles.active=local
# 默认值仅供本地开发兜底，生产环境必须通过环境变量覆盖
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cloud_drive}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

# JWT 配置
jwt:
  secret: ${JWT_SECRET:yourSecretKey12345678901234567890123456789012}   # 至少 32 个字符，生产必须替换
  expiration: ${JWT_EXPIRATION:86400000}   # 24小时（单位毫秒）

# 腾讯云 COS 配置
tencent:
  cos:
    # 永久密钥（生产环境通过环境变量注入，严禁硬编码）目前是测试用，后续要删掉
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-guangzhou}
    bucket-name: ${COS_BUCKET_NAME:}
    # 临时密钥有效期（秒），默认 1800 秒（30分钟）
    duration-seconds: ${COS_DURATION_SECONDS:1800}
    # 单文件最大限制（字节），默认 100MB
    max-file-size: ${COS_MAX_FILE_SIZE:104857600}

# MyBatis-Plus 配置
mybatis-plus:
  global-config:
    db-config:
      # 逻辑删除配置（对应实体类 @TableLogic）
      logic-not-delete-value: "NULL"
      logic-delete-value: "NOW()"
      # 主键自增
      id-type: auto
  configuration:
    # 开启驼峰命名自动映射
    map-underscore-to-camel-case: true
    # 生产环境关闭 SQL 日志；开发排障时取消注释
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
