spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cloud_drive}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_password_here}
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: localhost
    port: 6379
    password:
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

# JWT 配置
jwt:
  secret: ${JWT_SECRET:your-secret-key-at-least-32-chars}
  expiration: ${JWT_EXPIRATION:86400000}   # 24小时（单位毫秒）

# 腾讯云 COS 配置
tencent:
  cos:
    # 永久密钥（从腾讯云控制台获取）
    secret-id: ${COS_SECRET_ID:your-secret-id}
    secret-key: ${COS_SECRET_KEY:your-secret-key}
    # 存储桶配置
    region: ${COS_REGION:ap-guangzhou}
    bucket-name: ${COS_BUCKET_NAME:mycloud-1234567890}
    # 临时密钥有效期（秒），默认 1800 秒（30分钟）
    duration-seconds: ${COS_DURATION_SECONDS:1800}
    # 单文件最大限制（字节），默认 100MB
    max-file-size: ${COS_MAX_FILE_SIZE:104857600}

# MyBatis-Plus 配置
mybatis-plus:
  global-config:
    db-config:
      # 逻辑删除配置（对应实体类 @TableLogic）
      logic-not-delete-value: "NULL"
      logic-delete-value: "NOW()"
      # 主键自增
      id-type: auto
  configuration:
    # 开启驼峰命名自动映射
    map-underscore-to-camel-case: true
    # 日志输出（开发阶段开启）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl